<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gait Recognition System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gait Recognition System</h1>
            <div class="user-info">
                Welcome, {{ username }}! 
                <a href="{{ url_for('logout') }}" class="btn btn-small">Logout</a>
            </div>
        </div>
        
        <div class="video-container">
            <img src="{{ url_for('video_feed') }}" alt="Video Feed" class="video-feed" id="videoFeed">
            <div class="status" id="recordingStatus">Status: Idle</div>
            <div class="status" id="saveStatus"></div>
        </div>

        <div class="controls">
            <label for="angleSelect">Choose Angle:</label>
            <select id="angleSelect" class="btn">
                <option value="0">0°</option>
                <option value="45">45°</option>
                <option value="90">90°</option>
                <option value="135">135°</option>
                <option value="180">180°</option>
            </select>

            <button class="btn" onclick="startRecording()">Start Recording</button>
            <button class="btn" onclick="stopRecording()">Stop Recording</button>
            
            <!-- New Add Video button -->
            <button class="btn" onclick="document.getElementById('videoInput').click()">Add Video</button>
            <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="uploadVideo()">

            <button class="btn" onclick="analyzeGait()">Analyze Gait</button>
        </div>
    </div>

    <script>
        let videoFeed = document.getElementById('videoFeed');
        const saveStatusEl = document.getElementById('saveStatus');
        const recordingStatus = document.getElementById('recordingStatus');
        const angleSelect = document.getElementById('angleSelect');
        
        async function startRecording() {
            const angle = angleSelect.value;
            try {
                const response = await fetch(`/start_recording?view=${angle}`);
                const data = await response.json();
                if (data.status === 'success') {
                    recordingStatus.textContent = `Status: Recording (${angle}°)...`;
                    saveStatusEl.textContent = '';
                    videoFeed.src = "{{ url_for('video_feed') }}?" + new Date().getTime();
                } else {
                    recordingStatus.textContent = `Status: Error - ${data.message}`;
                }
            } catch (error) {
                console.error('Error starting recording:', error);
                recordingStatus.textContent = 'Status: Error starting recording';
            }
        }

        async function stopRecording() {
            try {
                const response = await fetch('/stop_recording');
                const data = await response.json();
                if (data.status === 'success') {
                    recordingStatus.textContent = 'Status: Stopped';
                    videoFeed.src = '';
                    saveStatusEl.textContent = data.message;
                } else {
                    recordingStatus.textContent = 'Status: Error stopping recording';
                }
            } catch (error) {
                console.error('Error stopping recording:', error);
                recordingStatus.textContent = 'Status: Error stopping recording';
            }
        }

        // ✅ New function to upload video file
        async function uploadVideo() {
            const angle = angleSelect.value;
            const fileInput = document.getElementById('videoInput');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("view", angle);

            try {
                const response = await fetch("/upload_video", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (data.status === "success") {
                    recordingStatus.textContent = `Status: Video Added (${angle}°)`;
                    saveStatusEl.textContent = data.message;
                } else {
                    recordingStatus.textContent = `Status: Error - ${data.message}`;
                }
            } catch (error) {
                console.error("Error uploading video:", error);
                recordingStatus.textContent = "Status: Error uploading video";
            }
        }

        function analyzeGait() {
            recordingStatus.textContent = 'Status: Analyzing...';
        }
    </script>
</body>
</html>
